services:
  agentic-loop:
    build: .
    # Every URL in services.yml is a localhost port, and Ollama also runs on the
    # host, so sharing the host network is what lets one config file work the
    # same whether the loop runs in a container or straight from Python.
    network_mode: host
    environment:
      OLLAMA_URL: http://localhost:11434
    volumes:
      # Mounted rather than baked in, so editing the endpoint list does not mean
      # rebuilding the image.
      - ./services.yml:/agentic-loop/services.yml:ro
      - ./reports:/agentic-loop/reports
    # A run finishes and exits; it is not a service. Start it with
    #   docker compose run --rm agentic-loop
    profiles:
      - tools
