# Lint settings for the agentic loop only. Every other folder owns its own
# tooling, so nothing here reaches outside this directory.

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["*.py", "loop/**/*.py"]
src = ["."]

[tool.ruff.lint]
# The same set the learning resource manager pins, so a new Ruff release cannot
# change what either folder enforces.
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.12"
# requests, yaml and ollama are third party and not all of them ship stubs.
ignore_missing_imports = true
explicit_package_bases = true
