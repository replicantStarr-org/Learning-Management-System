name: Learning Resource Manager CI

on:
  push:
    branches:
      - main
    paths:
      - "learning-resource-manager/**"
      # The frontend image copies shared/assets into the nginx root.
      - "shared/assets/**"
      - "tests/learning-resource-manager/**"
      - ".github/workflows/learning-resource-manager.yml"
  pull_request:
    branches:
      - main
    paths:
      - "learning-resource-manager/**"
      - "shared/assets/**"
      - "tests/learning-resource-manager/**"
      - ".github/workflows/learning-resource-manager.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    # Everything in this workflow is scoped to this service; no step reaches
    # into another team's folder.
    working-directory: learning-resource-manager

env:
  RAG_ENABLED: "false"
  # No multi-agent server or language model runs on the runner, so multi-agent
  # mode stays off for every job. docker-compose.yml passes this to the backend.
  MULTI_AGENT_ENABLED: "false"

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        # Pinned so a new Ruff or Mypy release cannot fail a build that has not
        # changed. Settings live in learning-resource-manager/pyproject.toml.
        run: pip install ruff==0.16.5 mypy==2.3.1

      - name: Run Ruff
        run: ruff check . --output-format=github

      - name: Run Mypy on the backend
        # The backend and database images each run from their own directory, so
        # they are checked as separate import roots rather than as one package.
        working-directory: learning-resource-manager/backend
        run: mypy . --config-file ../pyproject.toml

      - name: Run Mypy on the database
        working-directory: learning-resource-manager/database
        run: mypy . --config-file ../pyproject.toml

  compose:
    name: Build, Compose Up and Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write CI environment file
        # .env is gitignored, so CI supplies its own. No secrets are involved:
        # the database settings must match docker-compose.yml, and the model settings
        # are unused here because Ollama does not run on the runner.
        run: |
          cat > .env <<'EOF'
          DATABASE_NAME=l_r_db.db
          DATABASE_PATH=/app/data
          LANGUAGE_MODEL=qwen2.5:0.5b
          OLLAMA_URL=localhost
          OLLAMA_PORT=11434
          EOF

      - name: Build and start the services with MCP disabled
        # The database service runs for as long as the application does, and the
        # backend waits for its health check before starting. MCP is off, like
        # the subjects workflow, because no MCP server runs on the runner.
        run: MCP_ENABLED=false docker compose up --detach --build

      - name: Check the database service is serving
        run: |
          set -euo pipefail

          health="$(docker compose ps --all --format '{{.Service}} {{.Health}}' \
            | awk '$1 == "database" { print $2 }')"

          if [[ "$health" != "healthy" ]]; then
            echo "::error::database is ${health:-not running}."
            exit 1
          fi
          echo "database is healthy."

      - name: Smoke test the running application
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local description="$1"
            local url="$2"

            for attempt in {1..10}; do
              status="$(curl --silent --output /dev/null \
                --connect-timeout 2 --max-time 10 \
                --write-out '%{http_code}' "$url" || true)"

              if [[ "$status" == "200" ]]; then
                echo "$description responded with HTTP 200."
                return 0
              fi

              echo "$description attempt $attempt/10 returned HTTP ${status:-000}."
              if [[ "$attempt" -lt 10 ]]; then
                sleep 3
              fi
            done

            echo "::error::$description did not respond with HTTP 200 after 10 attempts."
            return 1
          }

          # The containers share the runner's network, so nothing is published
          # for compose to report; these are the ports from design.md that
          # docker-compose.yml and the nginx config bind directly.
          backend="http://localhost:5002"
          frontend="http://localhost:3002"
          echo "Backend on $backend, frontend on $frontend."

          # Reads the seeded resources back through the database service, so a
          # backend that cannot reach it fails here.
          probe "Backend resource list" "$backend/api/resources/all"
          # Reads the seeded highlights through the views, so a change to the
          # highlight schema that the views were not updated for fails here.
          probe "Highlight summary" "$backend/api/highlights/resource/1/summary"
          # Serves the single page app.
          probe "Frontend index" "$frontend/"
          # Proves the nginx proxy reaches the backend.
          probe "Frontend to backend proxy" "$frontend/api/highlights/colours"
          # Proves the content volume is mounted where PDF.js expects it.
          probe "Learning resource PDF" "$frontend/content/pdf/1706.03762.pdf"

          # The chat endpoint is deliberately not probed: it calls a language
          # model running on the developer's host, which no runner provides.

      - name: Verify MCP integration is disabled
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail http://localhost:5002/api/mcp/status)"
          echo "$response"
          jq -e '.enabled == false and .mcp_enabled == false' <<< "$response"

          # A tool route must refuse rather than try to reach an MCP server.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:5002/api/mcp/resources)"
          if [[ "$status" != "403" ]]; then
            echo "::error::/api/mcp/resources returned HTTP $status with MCP disabled, expected 403."
            exit 1
          fi
          echo "/api/mcp/resources is refused with HTTP 403."

      - name: Verify multi-agent mode is disabled
        shell: bash
        run: |
          set -euo pipefail

          # The backend reports the flag it was started with, so this proves the
          # workflow's MULTI_AGENT_ENABLED reached the container through compose.
          response="$(curl --silent --show-error --fail http://localhost:5002/config)"
          echo "$response"
          jq -e '.flags.MULTI_AGENT_ENABLED == false' <<< "$response"

      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the services
        if: always()
        run: docker compose down --volumes --remove-orphans

  evidence-upload:
    name: Evidence Upload
    runs-on: ubuntu-latest
    needs: compose
    steps:
      - name: Create evidence reports
        working-directory: .
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          timestamp="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p evidence

          jq --null-input \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg branch "$BRANCH" \
            --arg timestamp "$timestamp" \
            '{
              workflow_name: $workflow_name,
              run_id: $run_id,
              commit_sha: $commit_sha,
              branch: $branch,
              timestamp: $timestamp
            }' > evidence/learning-resource-manager-report.json

          cat > evidence/learning-resource-manager-report.md <<EOF
          # Learning Resource Manager CI Evidence

          - **Workflow:** $WORKFLOW_NAME
          - **Run ID:** $RUN_ID
          - **Commit SHA:** $COMMIT_SHA
          - **Branch:** $BRANCH
          - **Timestamp:** $timestamp
          - **GitHub Actions run:** $RUN_URL
          EOF

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: learning-resource-manager-ci-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  # The endpoint tests in tests/learning-resource-manager/, run against the real
  # compose stack. Deployment is not done here: cloud-deployment.yml calls this
  # workflow and deploys only once every feature's CI has passed.
  # Report files follow the subjects workflow's post-commit-tests job.
  post_commit_tests:
    name: Learning Resources API - Two endpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Relative to the repository root; steps run in learning-resource-manager/
      # by default, so those write through $GITHUB_WORKSPACE.
      REPORT_DIR: reports/learning-resources
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Pinned to the versions in backend/requirements.txt.
        run: pip install pytest==9.1.1 requests==2.34.2

      - name: Write CI environment file
        # The same file the compose job writes; docker-compose.yml requires it.
        run: |
          cat > .env <<'EOF'
          DATABASE_NAME=l_r_db.db
          DATABASE_PATH=/app/data
          LANGUAGE_MODEL=qwen2.5:0.5b
          OLLAMA_URL=localhost
          OLLAMA_PORT=11434
          EOF

      - name: Start the services
        # MCP off as in the compose job; RAG and multi-agent are off workflow-wide.
        run: MCP_ENABLED=false docker compose up --detach --build

      - name: Wait for the backend
        # The tests have no wait of their own, so they start only once the
        # backend can read the seeded catalogue through the database service.
        run: |
          curl --silent --show-error --fail --output /dev/null \
            --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 \
            http://localhost:5002/api/resources/catalogue

      - name: Test GET /api/resources/catalogue and /api/resources/tags
        id: tests
        # From the repository root, where tests/ lives. GitHub's bash runs with
        # pipefail, so a pytest failure still fails the step through tee.
        working-directory: .
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          python -m pytest tests/learning-resource-manager -v --color=no \
            --junitxml="$REPORT_DIR/test-results.xml" 2>&1 | tee "$REPORT_DIR/pytest.log"

      - name: Capture service logs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$REPORT_DIR"
          docker compose logs --no-color > "$GITHUB_WORKSPACE/$REPORT_DIR/compose.log" 2>&1

      - name: Stop services and delete test data
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Publish screenshot-friendly testing report
        if: always()
        working-directory: .
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          {
            echo '# Learning Resources — Post-Commit CI/CD Testing Report'
            echo
            echo "- Workflow: \`.github/workflows/learning-resource-manager.yml\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Two-endpoint pytest step: **$TEST_OUTCOME**"
            echo "- Job status before publishing: **$JOB_STATUS**"
            echo
            echo '| Backend endpoint function | Expected result |'
            echo '| --- | --- |'
            echo '| GET /api/resources/catalogue — get_catalogue | HTTP 200 and a JSON list of resources with tags, including the seeded "Attention Is All You Need" tagged Deep Learning |'
            echo '| GET /api/resources/tags — get_tags | HTTP 200 and a JSON list of tags, including the seeded Computer Science, Machine Learning and Deep Learning |'
            echo
            echo '## Automated pytest results'
            echo '```text'
            if [[ -f "$REPORT_DIR/pytest.log" ]]; then
              cat "$REPORT_DIR/pytest.log"
            else
              echo 'Tests did not run. See the failed setup/startup step and compose.log.'
            fi
            echo '```'
          } > "$REPORT_DIR/test-results.md"
          cat "$REPORT_DIR/test-results.md" >> "$GITHUB_STEP_SUMMARY"

          # One line per run for the audit trail. A skipped test step, from a
          # failed startup, counts as a failure.
          jq --null-input --compact-output \
            --arg status "$([[ "$TEST_OUTCOME" == success ]] && echo PASS || echo FAIL)" \
            --arg outcome "$TEST_OUTCOME" \
            --arg timestamp "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg commit_sha "$GITHUB_SHA" \
            '{status: $status, test_outcome: $outcome, timestamp: $timestamp, commit_sha: $commit_sha}' \
            >> "$REPORT_DIR/test-audit.jsonl"

      - name: Upload testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-resource-manager-post-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
