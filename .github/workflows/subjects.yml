name: Subjects Post-Commit Tests

on:
  pull_request:
    paths:
      - "subjects/**"
      - "shared/**"
      - "tests/subjects/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/subjects.yml"
  push:
    paths:
      - "subjects/**"
      - "shared/**"
      - "tests/subjects/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/subjects.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"
  COMPOSE_PROJECT_NAME: subjects-ci
  REPORT_DIR: reports/subjects

jobs:
  post-commit-tests:
    name: Subjects API — two endpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and start Subjects services
        run: docker compose --project-directory subjects up --detach --build

      - name: Test GET and POST /api/v1/subjects
        id: tests
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          python -m pytest tests/subjects/test_subjects_api.py -v --color=no 2>&1 | tee "$REPORT_DIR/pytest.log"

      - name: Test scriptable non-functional requirements
        id: nfr
        shell: bash
        run: bash subjects/scripts/nfr_validation.sh 2>&1 | tee "$REPORT_DIR/nfr-results.log"

      - name: Capture service logs
        if: always()
        run: |
          mkdir -p "$REPORT_DIR"
          docker compose --project-directory subjects logs --no-color > "$REPORT_DIR/compose.log" 2>&1

      - name: Stop services and delete test data
        if: always()
        run: docker compose --project-directory subjects down --volumes

      - name: Publish screenshot-friendly testing report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          NFR_OUTCOME: ${{ steps.nfr.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          {
            echo '# Subjects — Post-Commit CI/CD Testing Report'
            echo
            echo "- Workflow: \`.github/workflows/subjects.yml\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Two-endpoint pytest step: **$TEST_OUTCOME**"
            echo "- Existing NFR checks: **$NFR_OUTCOME**"
            echo "- Job status before publishing: **$JOB_STATUS**"
            echo
            echo '| Backend endpoint function | Expected result |'
            echo '| --- | --- |'
            echo '| GET /api/v1/subjects — api_list_subjects | HTTP 200 and a JSON list of subjects |'
            echo '| POST /api/v1/subjects — api_create_subject | HTTP 201 and the submitted fields with a new subject ID |'
            echo
            echo '## Automated pytest results'
            echo '```text'
            if [[ -f "$REPORT_DIR/pytest.log" ]]; then
              cat "$REPORT_DIR/pytest.log"
            else
              echo 'Tests did not run. See the failed setup/startup step and compose.log.'
            fi
            echo '```'
          } > "$REPORT_DIR/test-results.md"
          cat "$REPORT_DIR/test-results.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subjects-post-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
