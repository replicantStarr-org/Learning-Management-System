name: Quiz Management CI

on:
  # Release 2: endpoint tests also run after every push, not only on pull requests.
  push:
    paths:
      - "quizzes/**"
      - ".github/workflows/quizzes.yml"
  pull_request:
    paths:
      - "quizzes/**"
      - ".github/workflows/quizzes.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

jobs:
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build quiz service images
        working-directory: quizzes
        run: docker compose build

  smoke-check:
    name: Smoke Check
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start quiz services with MCP and RAG disabled
        working-directory: quizzes
        # No Ollama, MCP or RAG server runs on the runner, so all three are switched off here.
        run: AI_MODE_ENABLED=false MCP_ENABLED=false RAG_ENABLED=false docker compose up --detach --build

      - name: Probe quiz services
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local service="$1"
            local url="$2"

            for attempt in {1..8}; do
              status="$(curl --silent --show-error --output /dev/null \
                --connect-timeout 2 --max-time 5 \
                --write-out '%{http_code}' "$url" || true)"

              if [[ "$status" == "200" ]]; then
                echo "$service responded with HTTP 200."
                return 0
              fi

              echo "$service probe attempt $attempt/8 returned HTTP ${status:-000}."
              if [[ "$attempt" -lt 8 ]]; then
                sleep 2
              fi
            done

            echo "::error::$service did not respond with HTTP 200 after 8 attempts."
            return 1
          }

          probe "Quiz database" "http://localhost:6004/"
          probe "Quiz backend" "http://localhost:5004/"
          probe "Quiz frontend" "http://localhost:3004/"
          probe "Quiz RAG page" "http://localhost:3004/rag.html"
          probe "Quiz MCP page" "http://localhost:3004/mcp.html"

      - name: Verify MCP integration is disabled
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail http://localhost:5004/mcp/status)"
          echo "$response"
          jq -e '.enabled == false and .mcp_enabled == false' <<< "$response"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Content-Type: application/json" \
            --data '{"quiz_id": 1}' \
            http://localhost:5004/mcp/quiz)"
          if [[ "$status" != "403" ]]; then
            echo "::error::/mcp/quiz returned HTTP $status with MCP disabled, expected 403."
            exit 1
          fi
          echo "/mcp/quiz is refused with HTTP 403."

      - name: Verify RAG integration is disabled
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail http://localhost:5004/rag/status)"
          echo "$response"
          jq -e '.enabled == false and .rag_enabled == false' <<< "$response"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Content-Type: application/json" \
            --data '{"query": "What is a primary key?"}' \
            http://localhost:5004/rag/answer)"
          if [[ "$status" != "403" ]]; then
            echo "::error::/rag/answer returned HTTP $status with RAG disabled, expected 403."
            exit 1
          fi
          echo "/rag/answer is refused with HTTP 403."

      - name: Verify AI-Mode is disabled
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail http://localhost:5004/ai-mode/status)"
          echo "$response"
          jq -e '.enabled == false and .ai_mode_enabled == false' <<< "$response"

          for route in /quiz-generations /subjects/1/quiz-generations /attempts/1/feedback; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}'               --request POST --header "Content-Type: application/json"               --data '{"subject_id": 1}'               "http://localhost:5004${route}")"
            if [[ "$status" != "403" ]]; then
              echo "::error::${route} returned HTTP $status with AI-Mode disabled, expected 403."
              exit 1
            fi
            echo "${route} is refused with HTTP 403."
          done

      - name: Stop quiz services
        if: always()
        working-directory: quizzes
        run: docker compose down --volumes

  endpoint-tests:
    name: Endpoint Tests
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --requirement quizzes/tests/requirements.txt

      - name: Start quiz services
        working-directory: quizzes
        run: AI_MODE_ENABLED=false MCP_ENABLED=false RAG_ENABLED=false docker compose up --detach --build

      - name: Wait for the quiz backend
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --silent --fail --output /dev/null http://localhost:5004/; then
              echo "Quiz backend is up."
              exit 0
            fi
            echo "Waiting for the quiz backend ($attempt/15)."
            sleep 2
          done
          echo "::error::Quiz backend did not become ready."
          exit 1

      - name: Run endpoint tests (POST /quizzes and POST /quizzes/{id}/attempts)
        working-directory: quizzes
        run: |
          mkdir -p ../test-results
          python -m pytest --verbose --junitxml=../test-results/quizzes-endpoint-tests.xml

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizzes-endpoint-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error

      - name: Stop quiz services
        if: always()
        working-directory: quizzes
        run: docker compose down --volumes
  evidence-upload:
    name: Evidence Upload
    runs-on: ubuntu-latest
    needs: [smoke-check, endpoint-tests]
    steps:
      - name: Download endpoint test results
        uses: actions/download-artifact@v4
        with:
          name: quizzes-endpoint-test-results-${{ github.run_id }}
          path: test-results/

      - name: Create evidence reports
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          timestamp="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p evidence

          read -r tests failures errors skipped < <(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results/quizzes-endpoint-tests.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          print(*(suite.get(k, "0") for k in ("tests", "failures", "errors", "skipped")))
          PY
          )

          jq --null-input \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg branch "$BRANCH" \
            --arg timestamp "$timestamp" \
            --argjson tests "$tests" \
            --argjson failures "$failures" \
            --argjson errors "$errors" \
            --argjson skipped "$skipped" \
            '{
              workflow_name: $workflow_name,
              run_id: $run_id,
              commit_sha: $commit_sha,
              branch: $branch,
              timestamp: $timestamp,
              endpoint_tests: {
                endpoints: ["POST /quizzes", "POST /quizzes/{id}/attempts"],
                tests: $tests,
                failures: $failures,
                errors: $errors,
                skipped: $skipped
              }
            }' > evidence/quizzes-report.json

          cat > evidence/quizzes-report.md <<EOF
          # Quiz Management CI Evidence

          - **Workflow:** $WORKFLOW_NAME
          - **Run ID:** $RUN_ID
          - **Commit SHA:** $COMMIT_SHA
          - **Branch:** $BRANCH
          - **Timestamp:** $timestamp
          - **GitHub Actions run:** $RUN_URL

          ## Post-commit endpoint tests

          - **Endpoint 1:** POST /quizzes (create and validation)
          - **Endpoint 2:** POST /quizzes/{id}/attempts (grading)
          - **Tests run:** $tests
          - **Failures:** $failures
          - **Errors:** $errors
          - **Skipped:** $skipped
          EOF

          cp test-results/quizzes-endpoint-tests.xml evidence/

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: quizzes-ci-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
