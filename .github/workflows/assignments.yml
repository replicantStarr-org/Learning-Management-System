name: Assignment Management CI

on:
  workflow_call:
  pull_request:
    paths:
      - "assignments/**"
      - "mcp/**"
      - "multi-agent-server/**"
      - "prompts/areas/multi_agent_prompt.txt"
      - "prompts/services/assignments_prompt.txt"
      - "shared/**"
      - "tests/assignments/**"
      - ".github/workflows/assignments.yml"
  push:
    branches: [main]
    paths:
      - "assignments/**"
      - "mcp/**"
      - "multi-agent-server/**"
      - "prompts/areas/multi_agent_prompt.txt"
      - "prompts/services/assignments_prompt.txt"
      - "shared/**"
      - "tests/assignments/**"
      - ".github/workflows/assignments.yml"

permissions:
  contents: read

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build assignment service images
        working-directory: assignments
        run: docker compose build

  smoke-check:
    name: Smoke Check
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install endpoint test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start assignment services
        working-directory: assignments
        run: docker compose up --detach --build

      - name: Probe assignment services
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local service="$1"
            local url="$2"

            for attempt in {1..8}; do
              status="$(curl --silent --show-error --output /dev/null \
                --connect-timeout 2 --max-time 5 \
                --write-out '%{http_code}' "$url" || true)"

              if [[ "$status" == "200" ]]; then
                echo "$service responded with HTTP 200."
                return 0
              fi

              echo "$service probe attempt $attempt/8 returned HTTP ${status:-000}."
              if [[ "$attempt" -lt 8 ]]; then
                sleep 2
              fi
            done

            echo "::error::$service did not respond with HTTP 200 after 8 attempts."
            return 1
          }

          probe "Assignment database" "http://localhost:6003/"
          probe "Assignment backend" "http://localhost:5003/"
          probe "Assignment frontend" "http://localhost:3003/"
          probe "Assignment integration page" "http://localhost:3003/integration.html"
          probe "Assignment Multi-Agent page" "http://localhost:3003/multi-agent.html"

      - name: Verify MCP and RAG integrations are disabled
        shell: bash
        run: |
          set -euo pipefail
          for mode in mcp rag; do
            curl --silent --show-error --fail "http://localhost:5003/integration/$mode/status" \
              | jq -e '.enabled == false'
          done
          curl --silent --show-error --fail "http://localhost:3003/api/multi-agent/status" \
            | jq -e '.enabled == false'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"user_request":"CI disabled-mode probe"}' \
            "http://localhost:3003/api/multi-agent/workflow")"
          if [[ "$status" != "403" ]]; then
            echo "::error::Multi-Agent workflow returned HTTP $status with integration disabled; expected 403."
            exit 1
          fi
          for route in mcp/assignments rag/answer; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' \
              --data '{}' "http://localhost:5003/integration/$route")"
            if [[ "$status" != "403" ]]; then
              echo "::error::$route returned HTTP $status with integration disabled; expected 403."
              exit 1
            fi
          done

      - name: Validate the assignment REST API
        shell: bash
        run: |
          set -euo pipefail
          bash assignments/scripts/api_check.sh

      - name: Test two endpoint functions
        run: python -m pytest tests/assignments -v --color=no 2>&1 | tee "$RUNNER_TEMP/test-results.md"

      - name: Upload endpoint test output
        uses: actions/upload-artifact@v4
        with:
          name: assignments-endpoint-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/test-results.md

      - name: Stop assignment services
        if: always()
        working-directory: assignments
        run: docker compose down --volumes

  evidence-upload:
    name: Evidence Upload
    runs-on: ubuntu-latest
    needs: smoke-check
    steps:
      - name: Download endpoint test output
        uses: actions/download-artifact@v4
        with:
          name: assignments-endpoint-tests-${{ github.run_id }}
          path: evidence

      - name: Create evidence reports
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          timestamp="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p evidence

          jq --null-input \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg branch "$BRANCH" \
            --arg timestamp "$timestamp" \
            '{
              workflow_name: $workflow_name,
              run_id: $run_id,
              commit_sha: $commit_sha,
              branch: $branch,
              timestamp: $timestamp
            }' > evidence/assignments-report.json

          cat > evidence/assignments-report.md <<EOF
          # Assignment Management CI Evidence

          - **Workflow:** $WORKFLOW_NAME
          - **Run ID:** $RUN_ID
          - **Commit SHA:** $COMMIT_SHA
          - **Branch:** $BRANCH
          - **Timestamp:** $timestamp
          - **GitHub Actions run:** $RUN_URL
          EOF
          printf '\n## Endpoint test output\n\n' >> evidence/assignments-report.md
          cat evidence/test-results.md >> evidence/assignments-report.md

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: assignments-ci-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
