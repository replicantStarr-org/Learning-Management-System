name: Timetable Manager CI

on:
  push:
    branches:
      - main
    paths:
      - "timetable/**"
      - "shared/**"
      - "tests/timetable/**"
      - "requirements-dev.txt"
      - ".github/workflows/timetable.yml"
  pull_request:
    paths:
      - "timetable/**"
      - "shared/**"
      - "tests/timetable/**"
      - "requirements-dev.txt"
      - ".github/workflows/timetable.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  # No multi-agent server or language model runs on the runner, so multi-agent
  # mode stays off for every job. docker-compose.yml passes this to the backend.
  MULTI_AGENT_ENABLED: "false"

jobs:
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build timetable service images
        working-directory: timetable
        run: docker compose build

  smoke-check:
    name: Smoke Check
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start timetable services with MCP, RAG and multi-agent disabled
        working-directory: timetable
        # No MCP, RAG or multi-agent server runs on the runner, so all are switched off here.
        run: MCP_ENABLED=false RAG_ENABLED=false MULTI_AGENT_ENABLED=false docker compose up --detach --build

      - name: Probe timetable services
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local service="$1"
            local url="$2"

            for attempt in {1..8}; do
              status="$(curl --silent --show-error --output /dev/null \
                --connect-timeout 2 --max-time 5 \
                --write-out '%{http_code}' "$url" || true)"

              if [[ "$status" == "200" ]]; then
                echo "$service responded with HTTP 200."
                return 0
              fi

              echo "$service probe attempt $attempt/8 returned HTTP ${status:-000}."
              if [[ "$attempt" -lt 8 ]]; then
                sleep 2
              fi
            done

            echo "::error::$service did not respond with HTTP 200 after 8 attempts."
            return 1
          }

          probe "Timetable database" "http://localhost:6005/"
          probe "Timetable backend" "http://localhost:5005/"
          probe "Timetable frontend" "http://localhost:3005/"
          # Read by the RAG connector (rag-server/pipeline/connectors/timetable.py).
          probe "Timetable database users" "http://localhost:6005/timetable/users"
          probe "Timetable RAG page" "http://localhost:3005/rag.html"
          probe "Timetable MCP page" "http://localhost:3005/mcp.html"
          probe "Timetable multi-agent page" "http://localhost:3005/multi-agent"

      - name: Verify MCP integration is disabled
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail http://localhost:5005/mcp/status)"
          echo "$response"
          jq -e '.enabled == false and .mcp_enabled == false' <<< "$response"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Content-Type: application/json" \
            --data '{"username": "alex.wong", "on_date": "2026-01-05"}' \
            http://localhost:5005/mcp/free-time)"
          if [[ "$status" != "403" ]]; then
            echo "::error::/mcp/free-time returned HTTP $status with MCP disabled, expected 403."
            exit 1
          fi
          echo "/mcp/free-time is refused with HTTP 403."

      - name: Verify RAG integration is disabled
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail http://localhost:5005/rag/status)"
          echo "$response"
          jq -e '.enabled == false and .rag_enabled == false' <<< "$response"

          # A RAG route must refuse rather than try to reach a RAG server.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Content-Type: application/json" \
            --data '{"query": "What does alex.wong have on Monday?"}' \
            http://localhost:5005/rag/answer)"
          if [[ "$status" != "403" ]]; then
            echo "::error::/rag/answer returned HTTP $status with RAG disabled, expected 403."
            exit 1
          fi
          echo "/rag/answer is refused with HTTP 403."

      - name: Verify multi-agent mode is disabled
        shell: bash
        run: |
          set -euo pipefail

          # The backend reports the flag it was started with, so this proves the
          # workflow's MULTI_AGENT_ENABLED reached the container through compose.
          response="$(curl --silent --show-error --fail http://localhost:5005/config)"
          echo "$response"
          jq -e '.flags.MULTI_AGENT_ENABLED == false' <<< "$response"

          response="$(curl --silent --show-error --fail http://localhost:5005/multi-agent/status)"
          echo "$response"
          jq -e '.enabled == false' <<< "$response"

          # A workflow route must refuse rather than try to reach a multi-agent server.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Content-Type: application/json" \
            --data '{"user_request": "do not run"}' \
            http://localhost:5005/multi-agent/workflow)"
          if [[ "$status" != "403" ]]; then
            echo "::error::/multi-agent/workflow returned HTTP $status with multi-agent disabled, expected 403."
            exit 1
          fi
          echo "/multi-agent/workflow is refused with HTTP 403."

      - name: Dump service logs
        if: failure()
        working-directory: timetable
        run: docker compose logs --no-color

      - name: Stop timetable services
        if: always()
        working-directory: timetable
        run: docker compose down --volumes

  evidence-upload:
    name: Evidence Upload
    runs-on: ubuntu-latest
    needs: smoke-check
    steps:
      - name: Create evidence reports
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          timestamp="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p evidence

          jq --null-input \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg branch "$BRANCH" \
            --arg timestamp "$timestamp" \
            '{
              workflow_name: $workflow_name,
              run_id: $run_id,
              commit_sha: $commit_sha,
              branch: $branch,
              timestamp: $timestamp
            }' > evidence/timetable-report.json

          cat > evidence/timetable-report.md <<EOF
          # Timetable Manager CI Evidence

          - **Workflow:** $WORKFLOW_NAME
          - **Run ID:** $RUN_ID
          - **Commit SHA:** $COMMIT_SHA
          - **Branch:** $BRANCH
          - **Timestamp:** $timestamp
          - **GitHub Actions run:** $RUN_URL
          EOF

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: timetable-ci-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  # The endpoint tests in tests/timetable/, run against the real compose stack.
  # Deployment is not done here: cloud-deployment.yml calls this workflow and
  # deploys only once every feature's CI has passed.
  # Report files follow the subjects workflow's post-commit-tests job.
  post_commit_tests:
    name: Timetable API - Two endpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: reports/timetable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start timetable services
        # MCP, RAG and multi-agent are off workflow-wide.
        working-directory: timetable
        run: docker compose up --detach --build

      - name: Test GET /timetable and POST /timetable
        id: tests
        # GitHub's bash runs with pipefail, so a pytest failure still fails the
        # step through tee. conftest.py waits for the backend and database.
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          python -m pytest tests/timetable -v --color=no \
            --junitxml="$REPORT_DIR/test-results.xml" 2>&1 | tee "$REPORT_DIR/pytest.log"

      - name: Capture service logs
        if: always()
        run: |
          mkdir -p "$REPORT_DIR"
          docker compose --project-directory timetable logs --no-color > "$REPORT_DIR/compose.log" 2>&1

      - name: Stop services and delete test data
        if: always()
        working-directory: timetable
        run: docker compose down --volumes --remove-orphans

      - name: Publish screenshot-friendly testing report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          {
            echo '# Timetable — Post-Commit CI/CD Testing Report'
            echo
            echo "- Workflow: \`.github/workflows/timetable.yml\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Two-endpoint pytest step: **$TEST_OUTCOME**"
            echo "- Job status before publishing: **$JOB_STATUS**"
            echo
            echo '| Backend endpoint function | Expected result |'
            echo '| --- | --- |'
            echo '| GET /timetable — weekly_timetable | HTTP 200 and an HTML weekly grid including the seeded alex.wong "Advanced Software Development lecture" |'
            echo '| POST /timetable — add_entry | HTTP 201, an HX-Trigger of timetableChanged, and the submitted entry stored in the database |'
            echo
            echo '## Automated pytest results'
            echo '```text'
            if [[ -f "$REPORT_DIR/pytest.log" ]]; then
              cat "$REPORT_DIR/pytest.log"
            else
              echo 'Tests did not run. See the failed setup/startup step and compose.log.'
            fi
            echo '```'
          } > "$REPORT_DIR/test-results.md"
          cat "$REPORT_DIR/test-results.md" >> "$GITHUB_STEP_SUMMARY"

          # One line per run for the audit trail. A skipped test step, from a
          # failed startup, counts as a failure.
          jq --null-input --compact-output \
            --arg status "$([[ "$TEST_OUTCOME" == success ]] && echo PASS || echo FAIL)" \
            --arg outcome "$TEST_OUTCOME" \
            --arg timestamp "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg commit_sha "$GITHUB_SHA" \
            '{status: $status, test_outcome: $outcome, timestamp: $timestamp, commit_sha: $commit_sha}' \
            >> "$REPORT_DIR/test-audit.jsonl"

      - name: Upload testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-post-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
