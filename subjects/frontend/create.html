<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create subject | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="text-primary fw-semibold mb-2">Subject catalogue</p>
                <h1 class="display-6 fw-bold">Create a subject</h1>
                <p class="text-secondary mb-4">Add a subject to the learning catalogue.</p>
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form hx-post="http://localhost:5001/subjects" hx-target="#form-result">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="code">Code</label>
                                    <input class="form-control" id="code" name="code" maxlength="20" placeholder="ASD101" required autofocus>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="name">Name</label>
                                    <input class="form-control" id="name" name="name" maxlength="120" placeholder="Advanced Software Development" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="semester">Semester</label>
                                    <input class="form-control" id="semester" name="semester" maxlength="60" placeholder="Spring" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="coordinator">Coordinator</label>
                                    <input class="form-control" id="coordinator" name="coordinator" maxlength="120" placeholder="Dr. Morgan" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="status">Status</label>
                                    <input class="form-control" id="status" name="status" maxlength="60" placeholder="Open" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="description">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="6" maxlength="5000" required></textarea>
                                <div class="form-text">Maximum 5,000 characters.</div>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Create subject</button>
                                <a class="btn btn-outline-secondary" href="/">Cancel</a>
                            </div>
                            <div id="form-result" aria-live="polite"></div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
