server {
	listen 3001;
	listen [::]:3001;

	root /usr/share/nginx/html;

	# Only subject list/detail reads are public; never expose mutations or AI routes.
	location ~ ^/public/subjects(/[0-9]+)?$ {
		limit_except GET { deny all; }
		rewrite ^/public/(.*)$ /api/v1/$1 break;
		proxy_pass http://127.0.0.1:5001;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_read_timeout 180s;
	}

	location /public/ {
		return 404;
	}

	# Same-origin browser calls; loopback is shared locally and within each ACA replica.
	location ~ ^/(subjects|tags|api|auth|config)(/|$) {
		proxy_pass http://127.0.0.1:5001;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_read_timeout 180s;
	}

	location ~ ^/(mcp|rag|multi-agent)/ {
		proxy_pass http://127.0.0.1:5001;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_read_timeout 360s;
	}

	location = /mcp {
		try_files /mcp.html =404;
	}

	location = /rag {
		try_files /rag.html =404;
	}

	location = /multi-agent {
		try_files /multi-agent.html =404;
	}
}
