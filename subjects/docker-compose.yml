services:
  subject-frontend:
    build:
      context: ..
      dockerfile: subjects/frontend/Dockerfile
    network_mode: host
    depends_on:
      subject-backend:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html
          ignore:
            - Dockerfile
            - nginx.conf
        - action: sync
          path: ../shared/assets
          target: /usr/share/nginx/html/assets
        - action: sync+restart
          path: ./frontend/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./frontend/Dockerfile

  subject-backend:
    build:
      context: ./backend
    network_mode: host
    environment:
      DATABASE_SERVICE_URL: http://localhost:6001
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      SUMMARY_MAX_AGE_HOURS: 168
      JWT_SECRET: "${JWT_SECRET:-}"
      # Integrations are enabled by default for local application use. CI
      # disables external integrations on the compose command line.
      AI_MODE_ENABLED: "${AI_MODE_ENABLED:-true}"
      MCP_ENABLED: "${MCP_ENABLED:-true}"
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
      RAG_ENABLED: "${RAG_ENABLED:-true}"
      RAG_SERVER_URL: http://localhost:5010
      MULTI_AGENT_ENABLED: "${MULTI_AGENT_ENABLED:-true}"
      MULTI_AGENT_SERVICE_URL: http://localhost:15004
      MULTI_AGENT_WORKFLOW_TIMEOUT_SECONDS: 180
    depends_on:
      subject-database:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - Dockerfile
            - requirements.txt
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  subject-database:
    build:
      context: ./database
    network_mode: host
    volumes:
      - subject_database_data:/app/data
    restart: unless-stopped
    develop:
      watch:
        # Flask's debug reloader restarts the process after this file is synced.
        - action: sync
          path: ./database/app.py
          target: /app/app.py
        - action: rebuild
          path: ./database/init_db.py
        - action: rebuild
          path: ./database/requirements.txt
        - action: rebuild
          path: ./database/Dockerfile

volumes:
  subject_database_data:
