services:
  quiz-frontend:
    build:
      context: ..
      dockerfile: quizzes/frontend/Dockerfile
    network_mode: host
    depends_on:
      quiz-backend:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html
          ignore:
            - Dockerfile
            - nginx.conf
        - action: sync
          path: ../shared/assets
          target: /usr/share/nginx/html/assets
        - action: sync+restart
          path: ./frontend/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./frontend/Dockerfile

  quiz-backend:
    build:
      context: ./backend
    network_mode: host
    environment:
      DATABASE_SERVICE_URL: http://localhost:6004
      SUBJECTS_DATABASE_SERVICE_URL: http://localhost:6001
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      # MCP and RAG are enabled by default for local application use. CI
      # passes MCP_ENABLED=false and RAG_ENABLED=false on the compose command line.
      MCP_ENABLED: "${MCP_ENABLED:-true}"
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
      RAG_ENABLED: "${RAG_ENABLED:-true}"
      RAG_SERVER_URL: http://localhost:5010
    depends_on:
      quiz-database:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - Dockerfile
            - requirements.txt
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  quiz-database:
    build:
      context: ./database
    network_mode: host
    volumes:
      - quiz_database_data:/app/data
    restart: unless-stopped
    develop:
      watch:
        # Flask's debug reloader restarts the process after this file is synced.
        - action: sync
          path: ./database/app.py
          target: /app/app.py
        - action: rebuild
          path: ./database/init_db.py
        - action: rebuild
          path: ./database/requirements.txt
        - action: rebuild
          path: ./database/Dockerfile

volumes:
  quiz_database_data:
