<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate a quiz | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="text-primary fw-semibold mb-2">Quiz catalogue</p>
                <h1 class="display-6 fw-bold"><i class="bi bi-stars text-primary" aria-hidden="true"></i> Generate an AI practice quiz</h1>
                <p class="text-secondary mb-4">Pick a subject, difficulty, and number of questions - the AI will write the quiz for you.</p>
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form hx-post="http://localhost:5004/quiz-generations" hx-target="#form-result" hx-indicator="#generate-loading">
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label" for="subject_id">Subject</label>
                                    <select class="form-select" id="subject_id" name="subject_id" required autofocus
                                            hx-get="http://localhost:5004/subjects" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
                                        <option value="" disabled selected>Loading subjects…</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="difficulty">Difficulty</label>
                                    <select class="form-select" id="difficulty" name="difficulty">
                                        <option>Easy</option>
                                        <option selected>Medium</option>
                                        <option>Hard</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="question_count">Number of questions</label>
                                    <input class="form-control" id="question_count" name="question_count" type="number" min="3" max="10" value="5" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="topic_hint">Topic hint (optional)</label>
                                <textarea class="form-control" id="topic_hint" name="topic_hint" rows="2" maxlength="500" placeholder="e.g. focus on normalisation"></textarea>
                            </div>
                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                <button class="btn btn-primary" type="submit"><i class="bi bi-stars me-1"></i> Generate quiz</button>
                                <a class="btn btn-outline-secondary" href="/">Cancel</a>
                                <span class="htmx-indicator" id="generate-loading" role="status"><span class="spinner-border spinner-border-sm"></span> Generating… this can take up to a minute.</span>
                            </div>
                            <div id="form-result" aria-live="polite"></div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
