<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit quiz | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container-fluid page-shell px-3 px-lg-5">
        <a class="d-inline-block mb-4 text-decoration-none" href="/"><i class="bi bi-arrow-left me-1"></i> All quizzes</a>
        <p class="text-primary fw-semibold mb-2">Quiz catalogue</p>
        <h1 class="display-6 fw-bold mb-4">Edit quiz</h1>
        <div id="quiz-view" data-quiz-view="edit" aria-live="polite">
            <div class="text-center py-5" role="status">
                <span class="spinner-border text-primary"></span>
                <p class="text-secondary mt-2">Loading quiz…</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
