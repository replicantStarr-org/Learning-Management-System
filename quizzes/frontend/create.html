<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create quiz | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="text-primary fw-semibold mb-2">Quiz catalogue</p>
                <h1 class="display-6 fw-bold">Create a quiz manually</h1>
                <p class="text-secondary mb-4">Add a quiz shell here, then add its questions from the quiz's own page.</p>
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form hx-post="http://localhost:5004/quizzes" hx-target="#form-result">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="subject_id">Subject</label>
                                    <select class="form-select" id="subject_id" name="subject_id" required autofocus
                                            hx-get="http://localhost:5004/subjects" hx-trigger="load" hx-target="this" hx-swap="innerHTML"
                                            onchange="document.getElementById('subject_name').value = this.options[this.selectedIndex].text">
                                        <option value="" disabled selected>Loading subjects…</option>
                                    </select>
                                    <input type="hidden" id="subject_name" name="subject_name">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="title">Title</label>
                                    <input class="form-control" id="title" name="title" maxlength="150" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="difficulty">Difficulty</label>
                                    <select class="form-select" id="difficulty" name="difficulty">
                                        <option selected>Easy</option>
                                        <option>Medium</option>
                                        <option>Hard</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="description">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" maxlength="2000" required></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Create quiz</button>
                                <a class="btn btn-outline-secondary" href="/">Cancel</a>
                            </div>
                            <div id="form-result" aria-live="polite"></div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
