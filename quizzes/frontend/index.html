<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quizzes | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div id="page-message" class="alert alert-success mb-4" role="status" hidden></div>
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-5">
            <div>
                <p class="text-primary fw-semibold mb-2">Learning Management System</p>
                <h1 class="display-5 fw-bold">Quizzes</h1>
                <p class="lead text-secondary mb-0">Test your understanding with a quiz, or generate a new one with AI.</p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" href="/create.html"><i class="bi bi-pencil-square me-1"></i> Create manually</a>
                <a class="btn btn-primary" href="/generate.html"><i class="bi bi-stars me-1"></i> Generate with AI</a>
            </div>
        </div>

        <section id="quiz-list" aria-live="polite"
                 hx-get="http://localhost:5004/quizzes"
                 hx-trigger="load, quizzesChanged from:body">
            <div class="text-center py-5" role="status">
                <span class="spinner-border text-primary"></span>
                <p class="text-secondary mt-2">Loading quizzes…</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
