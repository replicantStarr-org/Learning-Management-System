# Security lint settings for the quizzes service only. The pre-commit hook in the
# repository root runs Ruff with these rules on every committed quizzes/ Python file.

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["backend/**/*.py", "database/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# S = flake8-bandit security rules. Pinned so a new Ruff release cannot silently change the gate.
select = ["S"]

[tool.ruff.lint.per-file-ignores]
# pytest tests assert by design.
"tests/**" = ["S101"]
