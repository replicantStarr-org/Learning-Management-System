name = "timetable"
base_url = "http://localhost:6005"

# Only timetable entries are indexed. The plans and advice tables hold earlier
# model output, which would have the model citing itself as evidence.
[[sources]]
entity = "entry"
label = "Timetable entry"
path = "/timetable"
# The API returns one user's entries per request and nothing lists the users,
# so they are named here. A user missing from this list is never indexed.
params = { username = ["alex.wong", "priya.patel", "sam.turner"] }
id_field = "timetable_id"
title = "{username}: {activity_name}, {day_of_week} {date}"
fields = [
    "username", "activity_name", "category", "day_of_week", "date",
    "start_time", "end_time", "notes",
]
