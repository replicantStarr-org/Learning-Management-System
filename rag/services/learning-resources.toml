name = "learning-resources"
# The backend, not the database: the database port is deliberately unpublished
# and only accepts raw SQL.
base_url = "http://localhost:7050"

[[sources]]
entity = "resource"
label = "Learning resource"
path = "/api/resources/all"
# Rows come back as arrays in the column order of the l_resource table
# (learning-resource-manager/database/construct_db.sql). Update this if that
# table changes, or ingestion fails with a row length error.
columns = ["l_resource_id", "location", "author", "medium", "title", "description"]
id_field = "l_resource_id"
title = "{title}"
fields = ["title", "author", "medium", "description"]
