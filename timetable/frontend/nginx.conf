server {
	listen 3005;
	listen [::]:3005;

	root /usr/share/nginx/html;

	location ~ ^/(timetable|config)(/|$)|^/(rag|mcp|multi-agent)/ {
		proxy_pass http://127.0.0.1:5005;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_read_timeout 300s;
	}

	location = /rag { try_files /rag.html =404; }
	location = /mcp { try_files /mcp.html =404; }
	location = /multi-agent { try_files /multi-agent.html =404; }
}
