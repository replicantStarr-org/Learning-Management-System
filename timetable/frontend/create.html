<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add timetable entry | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="text-primary fw-semibold mb-2">Weekly timetable</p>
                <h1 class="display-6 fw-bold">Add a timetable entry</h1>
                <p class="text-secondary mb-4">Block out a class, study session, or activity.</p>
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form hx-post="http://localhost:5005/timetable" hx-target="#form-result"
                              hx-on::after-request="if (event.detail.xhr.getResponseHeader('HX-Error') !== 'true') window.location.href = '/'">
                            <input type="hidden" name="username" data-username-field>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label" for="date">Date</label>
                                    <input class="form-control" type="date" id="date" name="date" required autofocus>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="start_time">Start time</label>
                                    <input class="form-control" type="time" id="start_time" name="start_time" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="end_time">End time</label>
                                    <input class="form-control" type="time" id="end_time" name="end_time" required>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label" for="activity_name">Activity (optional)</label>
                                    <input class="form-control" id="activity_name" name="activity_name" maxlength="120"
                                           placeholder="Defaults to &quot;Activity&quot; if left blank">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="category">Category</label>
                                    <select class="form-select" id="category" name="category" required>
                                        <option value="Class">Class</option>
                                        <option value="Study">Study</option>
                                        <option value="Personal">Personal</option>
                                        <option value="Work">Work</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="notes">Notes (optional)</label>
                                <textarea class="form-control" id="notes" name="notes" rows="3" maxlength="1000"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Add entry</button>
                                <a class="btn btn-outline-secondary" href="/">Cancel</a>
                            </div>
                            <div id="form-result" aria-live="polite"></div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
