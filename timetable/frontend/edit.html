<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit timetable entry | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="text-primary fw-semibold mb-2">Weekly timetable</p>
                <h1 class="display-6 fw-bold">Edit timetable entry</h1>
                <p class="text-secondary mb-4">Update the details below.</p>
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5" id="entry-form" data-timetable-view="edit" aria-live="polite">
                        <div class="text-center py-5" role="status">
                            <span class="spinner-border text-primary"></span>
                            <p class="text-secondary mt-2">Loading entry…</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
