services:
  timetable-frontend:
    build:
      context: ..
      dockerfile: timetable/frontend/Dockerfile
    network_mode: host
    depends_on:
      timetable-backend:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html
          ignore:
            - Dockerfile
            - nginx.conf
        - action: sync
          path: ../shared/assets
          target: /usr/share/nginx/html/assets
        - action: sync+restart
          path: ./frontend/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./frontend/Dockerfile

  timetable-backend:
    build:
      context: ./backend
    network_mode: host
    environment:
      DATABASE_SERVICE_URL: http://localhost:6005
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      OLLAMA_TIMEOUT_SECONDS: 240
      OLLAMA_MAX_RETRIES: 0
      PLAN_MAX_AGE_HOURS: 24
      IMPORT_RANGE_WEEKS: 16
      IMPORT_TIMEZONE: Australia/Sydney
    depends_on:
      timetable-database:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - Dockerfile
            - requirements.txt
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  timetable-database:
    build:
      context: ./database
    network_mode: host
    volumes:
      - timetable_database_data:/app/data
    restart: unless-stopped
    develop:
      watch:
        # Flask's debug reloader restarts the process after this file is synced.
        - action: sync
          path: ./database/app.py
          target: /app/app.py
        - action: rebuild
          path: ./database/init_db.py
        - action: rebuild
          path: ./database/requirements.txt
        - action: rebuild
          path: ./database/Dockerfile

volumes:
  timetable_database_data:
