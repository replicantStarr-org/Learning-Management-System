<!DOCTYPE html>
<html lang="en">
	<head>
	  	<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	   	<title>Learning Resource Manager</title>
		<script src="htmx.min.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<link rel="stylesheet" href="/assets/theme.css">
		<link rel="stylesheet" href="./css/main.css">
	</head>
	<body>
		<div>
			<div class="container page-shell">

				<div class="d-flex justify-content-between align-items-start gap-3 mb-4">
					<div>
						<h1 class="h3 mb-1">LEARNING RESOURCES</h1>
						<p class="text-secondary mb-0">Textbooks and papers in the library.</p>
					</div>
					<button type="button" class="btn btn-primary flex-shrink-0" data-bs-toggle="modal" data-bs-target="#upload-modal">
						Upload PDF
					</button>
				</div>

				<div id="spinner" class="htmx-indicator text-center mb-3">
					<div class="spinner-border text-primary" role="status">
						<span class="visually-hidden">LOADING...</span>
					</div>
				</div>

				<div id="book-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" hx-get="/api/resources/all_html" hx-trigger="load" hx-swap="innerHTML" hx-indicator="#spinner">
				</div>
			</div>
		</div>

		<!-- Expanded resource details, opened by clicking a card. -->
		<div class="modal fade" id="detail-modal" tabindex="-1" aria-labelledby="detail-title" aria-hidden="true">
			<div class="modal-dialog modal-lg modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h2 class="modal-title h5" id="detail-title"></h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="row g-4">
							<div class="col-sm-5">
								<div class="resource-thumb detail-thumb">
									<canvas id="detail-canvas"></canvas>
								</div>
							</div>
							<div class="col-sm-7">
								<p class="resource-author mb-3" id="detail-author"></p>
								<p class="text-secondary mb-0" id="detail-description"></p>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-danger me-auto" id="detail-remove">Remove</button>
						<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
						<button type="button" class="btn btn-primary" id="detail-read">Read</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Full document reader, opened by the Read button. -->
		<div class="modal fade" id="reader-modal" tabindex="-1" aria-labelledby="reader-title" aria-hidden="true">
			<div class="modal-dialog modal-fullscreen-lg-down modal-xl modal-dialog-centered">
				<div class="modal-content reader-content">
					<div class="modal-header">
						<h2 class="modal-title h6" id="reader-title"></h2>
						<span class="text-secondary small ms-3" id="reader-status"></span>
						<button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body reader-body" id="reader-body">
						<div class="reader-pages" id="reader-pages"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- Add a resource: drop or choose a PDF, then describe it. -->
		<div class="modal fade" id="upload-modal" tabindex="-1" aria-labelledby="upload-heading" aria-hidden="true">
			<div class="modal-dialog modal-lg modal-dialog-centered">
				<div class="modal-content">
					<form id="upload-form">
						<div class="modal-header">
							<h2 class="modal-title h5" id="upload-heading">Upload a PDF</h2>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div class="dropzone" id="dropzone">
								<input type="file" id="upload-file" name="file" accept="application/pdf,.pdf" hidden>
								<p class="mb-1">Drag a PDF here</p>
								<p class="text-secondary small mb-2">or</p>
								<button type="button" class="btn btn-outline-secondary btn-sm" id="upload-browse">Choose a file</button>
								<p class="dropzone-filename small mb-0" id="upload-filename"></p>
							</div>

							<div class="row g-3 mt-1">
								<div class="col-sm-6">
									<label class="form-label" for="upload-title">Title</label>
									<input type="text" class="form-control" id="upload-title" name="title" required>
								</div>
								<div class="col-sm-6">
									<label class="form-label" for="upload-author">Author</label>
									<input type="text" class="form-control" id="upload-author" name="author">
								</div>
								<div class="col-12">
									<label class="form-label" for="upload-description">Description</label>
									<textarea class="form-control" id="upload-description" name="description" rows="2"></textarea>
								</div>
								<div class="col-12">
									<span class="form-label d-block mb-2">Tags</span>
									<div class="tag-choices" id="upload-tags"
									     hx-get="/api/resources/tags_html" hx-trigger="load" hx-swap="innerHTML"></div>
								</div>
							</div>

							<p class="upload-error small mb-0" id="upload-error" hidden></p>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
							<button type="submit" class="btn btn-primary" id="upload-submit">Add resource</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<!-- Library assistant, opened by the floating button. -->
		<button type="button" class="btn btn-primary chat-launcher" data-bs-toggle="modal" data-bs-target="#chat-modal">
			Ask the library
		</button>

		<div class="modal fade" id="chat-modal" tabindex="-1" aria-labelledby="chat-heading" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content chat-content">
					<div class="modal-header">
						<h2 class="modal-title h6" id="chat-heading">Library assistant</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body chat-log" id="chat-log" role="log" aria-live="polite">
						<p class="text-secondary small mb-0" id="chat-hint">
							Ask for a resource and I will search the library by tag, for example
							&ldquo;do you have anything about cosmology?&rdquo;
						</p>
					</div>
					<div class="modal-footer">
						<form class="chat-form" id="chat-form">
							<input type="text" class="form-control" id="chat-input" autocomplete="off"
							       placeholder="What are you looking for?" aria-label="Your question">
							<button type="submit" class="btn btn-primary" id="chat-send">Send</button>
						</form>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="./js/main.js" type="module"></script>
	</body>
</html>
