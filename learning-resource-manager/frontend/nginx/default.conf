server {
	listen 80; 

	location / {
		root /usr/share/nginx/html;
		index index.html;
	}

	location /api/ {
		proxy_pass http://backend:5000/api/;
	}

	# Learning resource PDFs, served straight from the mounted volume so that
	# PDF.js can pull page ranges instead of whole documents.
	location /content/ {
		alias /content/;
	}
}
