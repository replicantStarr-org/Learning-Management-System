server {
	listen 3002;
	listen [::]:3002;

	root /usr/share/nginx/html;

	location / {
		index index.html;
		# index.html pulls in multi-agent.html with a server side include, so
		# the page arrives whole, exactly as if the view were written inline.
		ssi on;
	}

	# Only a fragment of index.html, so it is reachable through the include
	# above but not as a page of its own.
	location = /multi-agent.html {
		internal;
	}

	location = /config {
		proxy_pass http://127.0.0.1:5002;
		proxy_set_header Host $http_host;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:5002/api/;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		# Uploads are whole PDFs; nginx would reject them at the 1M default.
		client_max_body_size 64M;
		# Chat replies come from a local language model and routinely take longer
		# than the 60 second default, which would otherwise surface as a 504.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	# Learning resource PDFs, served straight from the mounted volume so that
	# PDF.js can pull page ranges instead of whole documents.
	location /content/ {
		alias /content/;
	}
}
