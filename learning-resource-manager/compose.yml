# Containers are named learning-hub-LRM-* so they are easy to pick out of the
# whole hub's stack. Set here rather than by renaming the services: Compose
# names built images after the service, and image names must be lowercase. The
# service names also stay short, since nginx and the backend reach each other
# by them.
services:
  backend:
    container_name: learning-hub-LRM-backend
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - ".env"
    environment:
      - CONTENT_PATH=/content
      # Every statement goes to the database service over this address; the
      # backend never opens the database file itself.
      - DATABASE_SERVICE_URL=http://database:5000
      # Ollama runs on the host, so "localhost" from inside this container would
      # be the container itself.
      - OLLAMA_URL=host.docker.internal
      # The RAG server (rag-server/) also runs on the host, on server.port in
      # its config.toml.
      - RAG_SERVER_URL=http://host.docker.internal:5010
      # The shared MCP server (mcp/) runs on the host too; see MCP_HOST in
      # mcp/server.py for why it can be reached from here.
      - MCP_SERVER_URL=http://host.docker.internal:8000/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Nothing the backend serves works until the database service answers, so
    # wait for its health check rather than just for the container to start.
    depends_on:
      database:
        condition: service_healthy
    volumes:
      # Writable here because uploads land in it; the frontend mounts it read
      # only because it just serves the files.
      - ./content:/content
    ports:
      - "7050:5000"

  # Owns the database file and runs the statements the backend sends it. The
  # port is deliberately not published: only the backend has any business here.
  database:
    container_name: learning-hub-LRM-database
    build:
      context: database
      dockerfile: Dockerfile
    env_file:
      - ".env"
    environment:
      - DATABASE_PATH=/app/data
    volumes:
      - l_r_data:/app/data
    healthcheck:
      # python rather than curl, because the slim image ships no HTTP client.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    container_name: learning-hub-LRM-frontend
    build:
      context: ..
      dockerfile: learning-resource-manager/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./content:/content:ro
    ports:
      - "3002:80"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /usr/share/nginx/html
        - action: sync
          path: ../shared/assets
          target: /usr/share/nginx/html/assets
        - action: sync+restart
          path: ./frontend/nginx/default.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  l_r_data:
