services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - ".env"
    environment:
      - DATABASE_PATH=/app/data
    volumes:
      - l_r_data:/app/data
    ports:
      - "7050:7050"

  database_init:
    build:
      context: database
      dockerfile: Dockerfile
    env_file:
      - ".env"
    environment:
      - DATABASE_PATH=/app/data
    volumes:
      - l_r_data:/app/data
  
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "7051:80"

volumes:
  l_r_data:

