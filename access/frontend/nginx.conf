server {
    listen 3000;
    listen [::]:3000;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects on the browser's origin (cloud HTTPS or local :3000),
    # rather than exposing this upstream server's HTTP scheme/listen port.
    absolute_redirect off;

    # Authorise protected pages before nginx sends any HTML to the browser.
    location = / {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        try_files /index.html =404;
    }

    # Do not allow the protected page to be bypassed via its file name.
    location = /index.html {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        try_files /index.html =404;
    }

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:5000/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @login_redirect {
        return 302 /login;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
