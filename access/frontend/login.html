<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand text-primary" href="/">Learning Hub</a>
        </div>
    </nav>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <section class="card auth-card shadow-sm">
                    <div class="card-body">
                        <p class="text-primary fw-semibold mb-2">Welcome back</p>
                        <h1 class="h2 mb-2">Log in</h1>
                        <p class="text-secondary mb-4">Enter your details to continue to the learning hub.</p>

                        <div id="form-message" role="alert" aria-live="polite"></div>
                        <form data-auth-form="login">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Log in</button>
                        </form>
                        <p class="text-center text-secondary mt-4 mb-0">New here? <a href="/register">Create an account</a></p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
