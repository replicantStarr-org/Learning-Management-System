minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-security
        name: Ruff security scan (repository)
        entry: python scripts/pre_commit.py ruff --config pyproject.toml .
        language: python
        additional_dependencies: [ruff==0.17.1]
        pass_filenames: false
        always_run: true
      - id: detect-secrets
        name: Secret scan (all tracked files)
        entry: python scripts/pre_commit.py detect-secrets --exclude-secrets ^ollama$
        language: python
        additional_dependencies: [detect-secrets==1.5.0]
        pass_filenames: false
        always_run: true
      - id: pip-audit
        name: Dependency audits (all requirements files)
        entry: python scripts/pre_commit.py pip-audit
        language: python
        additional_dependencies: [pip-audit==2.10.1]
        pass_filenames: false
        always_run: true
