services:
  assignment-frontend:
    build:
      context: ..
      dockerfile: assignments/frontend/Dockerfile
    network_mode: host
    depends_on:
      assignment-backend:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html
          ignore:
            - Dockerfile
            - nginx.conf
        - action: sync
          path: ../shared/assets
          target: /usr/share/nginx/html/assets
        - action: sync+restart
          path: ./frontend/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./frontend/Dockerfile

  assignment-backend:
    build:
      context: ./backend
    network_mode: host
    environment:
      DATABASE_SERVICE_URL: http://localhost:6003
      SUBJECTS_DATABASE_SERVICE_URL: http://localhost:6001
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_SUMMARY_MODEL: qwen2.5:0.5b
    depends_on:
      assignment-database:
        condition: service_started
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - Dockerfile
            - requirements.txt
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  assignment-database:
    build:
      context: ./database
    network_mode: host
    volumes:
      - assignment_database_data:/app/data
    restart: unless-stopped
    develop:
      watch:
        # Flask's debug reloader restarts the process after this file is synced.
        - action: sync
          path: ./database/app.py
          target: /app/app.py
        - action: rebuild
          path: ./database/init_db.py
        - action: rebuild
          path: ./database/requirements.txt
        - action: rebuild
          path: ./database/Dockerfile

volumes:
  assignment_database_data:
