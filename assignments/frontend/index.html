<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignments | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div id="page-message" class="alert alert-success mb-4" role="status" hidden></div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
            <div>
                <p class="text-primary fw-semibold mb-2">Learning Management System</p>
                <h1 class="display-5 fw-bold">Assignments</h1>
                <p class="lead text-secondary mb-0">Track what is due, and let the AI break a brief down for you.</p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" href="/upcoming.html"><i class="bi bi-alarm me-1"></i> Upcoming deadlines</a>
                <a class="btn btn-primary" href="/create.html"><i class="bi bi-plus-lg me-1"></i> Add assignment</a>
            </div>
        </div>

        <section class="mb-4" aria-label="Deadline notifications">
            <div id="notifications" aria-live="polite"
                 hx-get="http://127.0.0.1:5003/reminders?within_days=14"
                 hx-trigger="load, every 60s, assignmentsChanged from:body"></div>
        </section>

        <section class="card border-0 shadow-sm mb-4" aria-label="Filters">
            <div class="card-body p-3">
                <form id="filters" class="row g-2 align-items-end"
                      hx-get="http://127.0.0.1:5003/assignments"
                      hx-target="#assignment-list"
                      hx-trigger="load, change, keyup changed delay:300ms from:#q, assignmentsChanged from:body">
                    <div class="col-md-4">
                        <label class="form-label" for="q">Search</label>
                        <input class="form-control" id="q" name="q" type="search" maxlength="100"
                               placeholder="Title, description or subject">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="subject_id">Subject</label>
                        <select class="form-select" id="subject_id" name="subject_id"
                                hx-get="http://127.0.0.1:5003/subjects/options" hx-trigger="load"
                                hx-target="this" hx-swap="beforeend">
                            <option value="" selected>All subjects</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="status">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="" selected>All statuses</option>
                            <option>Not Started</option>
                            <option>In Progress</option>
                            <option>Submitted</option>
                            <option>Graded</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="priority">Priority</label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="" selected>Any</option>
                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                        </select>
                    </div>
                </form>
            </div>
        </section>

        <section id="assignment-list" aria-live="polite">
            <div class="text-center py-5" role="status">
                <span class="spinner-border text-primary"></span>
                <p class="text-secondary mt-2">Loading assignments…</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
