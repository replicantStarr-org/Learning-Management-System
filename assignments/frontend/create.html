<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add assignment | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <p class="text-primary fw-semibold mb-2">Assignment tracker</p>
                <h1 class="display-6 fw-bold">Add an assignment</h1>
                <p class="text-secondary mb-4">A reminder is scheduled automatically three days before the due date.</p>
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form hx-post="http://127.0.0.1:5003/assignments" hx-target="#form-result">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="subject_id">Subject</label>
                                    <select class="form-select" id="subject_id" name="subject_id" required autofocus
                                            hx-get="http://127.0.0.1:5003/subjects/options" hx-trigger="load"
                                            hx-target="this" hx-swap="beforeend"
                                            onchange="document.getElementById('subject_name').value = this.options[this.selectedIndex].text">
                                        <option value="" disabled selected>Choose a subject…</option>
                                    </select>
                                    <input type="hidden" id="subject_name" name="subject_name">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="title">Title</label>
                                    <input class="form-control" id="title" name="title" maxlength="150" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="due_at">Due</label>
                                    <input class="form-control" id="due_at" name="due_at" type="datetime-local" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="priority">Priority</label>
                                    <select class="form-select" id="priority" name="priority">
                                        <option>Low</option>
                                        <option selected>Medium</option>
                                        <option>High</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="weighting">Weighting (%)</label>
                                    <input class="form-control" id="weighting" name="weighting" type="number" min="0" max="100" value="10" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="description">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3" maxlength="2000" required></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="requirements">Requirements</label>
                                <textarea class="form-control" id="requirements" name="requirements" rows="5" maxlength="4000"
                                          placeholder="Deliverables, word counts, formats, marking criteria…" required></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Add assignment</button>
                                <a class="btn btn-outline-secondary" href="/">Cancel</a>
                            </div>
                            <div id="form-result" aria-live="polite"></div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
