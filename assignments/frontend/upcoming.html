<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upcoming deadlines | Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/theme.css" rel="stylesheet">
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <header hx-get="/navbar.html" hx-trigger="load" hx-swap="outerHTML"></header>

    <main class="container page-shell">
        <a class="d-inline-block mb-4 text-decoration-none" href="/"><i class="bi bi-arrow-left me-1"></i> All assignments</a>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
            <div>
                <p class="text-primary fw-semibold mb-2">Assignment tracker</p>
                <h1 class="display-5 fw-bold">Upcoming deadlines</h1>
                <p class="lead text-secondary mb-0">Unfinished work due inside your chosen window.</p>
            </div>
            <form class="d-flex align-items-end gap-2"
                  hx-get="http://127.0.0.1:5003/assignments/upcoming"
                  hx-target="#upcoming-list" hx-trigger="load, change">
                <div>
                    <label class="form-label" for="days">Window</label>
                    <select class="form-select" id="days" name="days">
                        <option value="3">Next 3 days</option>
                        <option value="7" selected>Next 7 days</option>
                        <option value="14">Next 14 days</option>
                        <option value="30">Next 30 days</option>
                    </select>
                </div>
            </form>
        </div>

        <section class="mb-4" aria-label="Deadline notifications">
            <h2 class="h5 mb-3">Notifications</h2>
            <div id="notifications" aria-live="polite"
                 hx-get="http://127.0.0.1:5003/reminders?within_days=30"
                 hx-trigger="load, every 60s, assignmentsChanged from:body"></div>
        </section>

        <section class="card border-0 shadow-sm" aria-label="Upcoming assignments">
            <div class="card-body p-0">
                <div id="upcoming-list" aria-live="polite">
                    <div class="text-center py-5" role="status">
                        <span class="spinner-border text-primary"></span>
                        <p class="text-secondary mt-2">Loading deadlines…</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
